version: '3.8'

services:
  app:
    build: .
    container_name: reliability-app
    ports:
      - "8000:8000"
    restart: always
    # Kept the healthcheck from your original code so the platform stays robust!
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app
    restart: always

